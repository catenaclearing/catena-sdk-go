        execution_interval_seconds:
          description: The interval between scheduled executions in seconds.
          title: Execution Interval
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        consecutive_error_count:
          description: The number of consecutive errors that have occurred for this
            schedule.
          title: Consecutive Error Count
          type: integer
        consecutive_error_threshold:
          description: The number of consecutive errors allowed before the schedule
            is automatically set to INACTIVE.
          title: Consecutive Error Threshold
          type: integer
        max_concurrent_executions:
          description: The maximum number of concurrent executions allowed for this
            schedule.
          title: Max Concurrent Executions
          type: integer
        cursor:
          nullable: true
          type: string
