      description: |-
        Get a paginated list of resource operations.

        Supports flexible filtering by date range, resource type, connection, source, fleet reference,
        operation type, and source ID. Use `source_id` together with `resource` to target a specific
        record in the TSP.
      operationId: list_resource_operations
      parameters:
      - description: "Filter resource operations by resource type (e.g., `vehicle`,\
          \ `user`, `fuel_charge`)."
        explode: true
        in: query
        name: resource
        required: false
        schema:
          $ref: '#/components/schemas/ResourceEnum'
        style: form
      - description: Filter resource operations by connection ID.
        explode: true
        in: query
        name: connection_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - description: Filter resource operations by source name.
        explode: true
        in: query
        name: source_name
        required: false
        schema:
          $ref: '#/components/schemas/TspEnum'
        style: form
      - description: "Filter resource operations by one or more fleet references.\
          \ **Maximum:** 100 values. To specify multiple values, repeat the parameter\
          \ for each value (e.g., `?fleet_refs=ref1&fleet_refs=ref2`)."
        explode: true
        in: query
        name: fleet_refs
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          nullable: true
          type: array
        style: form
      - description: "Filter resource operations by operation type (e.g., `create`,\
          \ `update`)."
        explode: true
        in: query
        name: operation
        required: false
        schema:
          $ref: '#/components/schemas/ResourceOperationTypeEnum'
        style: form
      - description: Filter resource operations by source ID in the TSP. Requires
          the `resource` parameter.
        explode: true
        in: query
        name: source_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Return only records that occurred on or after this date and time.
          **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at >= from_datetime`
          **Default value:** `now() - 1 day` **Restriction:** `to_datetime - from_datetime`
          cannot exceed 45 days
        explode: true
        in: query
        name: from_datetime
        required: false
        schema:
          description: Return only records that occurred on or after this date and
            time. **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at >= from_datetime`
            **Default value:** `now() - 1 day` **Restriction:** `to_datetime - from_datetime`
            cannot exceed 45 days
          format: date-time
          title: From Datetime
          type: string
        style: form
      - description: Return only records that occurred before this date and time.
          **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at < to_datetime`
          **Default value:** `now()` **Restriction:** `to_datetime - from_datetime`
          cannot exceed 45 days
        explode: true
        in: query
        name: to_datetime
        required: false
        schema:
          description: Return only records that occurred before this date and time.
