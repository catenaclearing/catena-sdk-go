        status: active
      properties:
        resource:
          $ref: '#/components/schemas/ResourceEnum'
        execution_interval_seconds:
          default: 600
          description: The interval between scheduled executions in seconds. Defaults
            to 10 minutes (600 seconds).
          title: Execution Interval
          type: integer
        consecutive_error_threshold:
          default: 15
          description: The number of consecutive errors allowed before the schedule
            is automatically set to INACTIVE. Defaults to 15.
          title: Consecutive Error Threshold
          type: integer
        max_concurrent_executions:
          default: 1
          description: The maximum number of concurrent executions allowed for this
            schedule. Defaults to 1.
          title: Max Concurrent Executions
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        cursor:
          nullable: true
          type: string
      required:
      - resource
      title: ScheduleCreate
    ScheduleRead:
      description: API Model for reading a schedule
      example:
        consecutive_error_count: 0
        consecutive_error_threshold: 15
        cursor: cursor-1
        execution_interval_seconds: 600
        max_concurrent_executions: 1
        resource: vehicle
      properties:
        id:
          description: Unique identifier for the schedule.
          format: uuid
          title: Schedule ID
          type: string
        connection_id:
