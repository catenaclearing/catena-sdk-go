openapi: 3.1.0
info:
  description: Telematics Data Service REST API.
  title: Telematics Data Service - REST API
  version: 0.1.0
servers:
- description: Catena Telematics API
  url: https://api.catenatelematics.com
tags:
- description: "Endpoints for tracking vehicles, trailers, assets, and trip activity\
    \ — including locations, movements, and operational telemetry. Useful for monitoring\
    \ utilization and real-time operational status."
  name: Fleet Operations & Tracking
- description: "Endpoints that provide safety-related insights such as harsh braking,\
    \ speeding, and other driver behavior events. Supports risk analysis and safety\
    \ program automation."
  name: Safety & Driver Behavior
- description: "Endpoints covering regulated requirements including DVIR inspections,\
    \ Hours of Service (HOS), violations, and IFTA fuel tax reporting. Helps organizations\
    \ meet DOT/FMCSA and interstate regulatory obligations."
  name: Compliance & Regulation
- description: "Endpoints providing data for vehicle condition monitoring and maintenance\
    \ workflows, such as DVIR defects and diagnostic sensor events. Enables early\
    \ issue detection and reduced downtime."
  name: Maintenance & Vehicle Health
- description: "Endpoints related to driver and user identities, assignments, and\
    \ operational context. Supports linking operational and safety data to specific\
    \ individuals."
  name: Drivers & Users
- description: "Lookup tables and enumerations that supply standardized codes, metadata,\
    \ and classifications used across the API."
  name: Reference Data (Supporting Tables)
- description: "Endpoints providing analytical insights and aggregated data for vehicles,\
    \ fleets, drivers, and trailers."
  name: Analytics
paths:
  /v2/telematics/driver-safety-events:
    get:
      description: Get a paginated list of driver safety events accessible to your
        organization.
      operationId: list_driver_safety_events
      parameters:
      - description: "Limit results to specific fleets using Catena's fleet IDs. *For\
          \ your own fleet identifiers, use `fleet_refs` instead* To specify multiple\
          \ values, repeat the parameter for each value (e.g., `?fleet_ids=id1&fleet_ids=id2`)."
        explode: true
        in: query
        name: fleet_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          maxItems: 100
          nullable: true
          type: array
        style: form
      - description: "Limit results to specific fleets using your organization's fleet\
          \ reference identifiers. To specify multiple values, repeat the parameter\
          \ for each value (e.g., `?fleet_refs=ref1&fleet_refs=ref2`)."
        explode: true
        in: query
        name: fleet_refs
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          nullable: true
          type: array
        style: form
      - description: Limit results to a specific provider connection. This is the
          UUID assigned by Catena when your fleet connects to a TSP.
        explode: true
        in: query
        name: connection_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - description: Return only records that occurred on or after this date and time.
          **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at >= from_datetime`
          **Default value:** `now() - 1 day` **Restriction:** `to_datetime - from_datetime`
          cannot exceed 45 days
        explode: true
        in: query
        name: from_datetime
        required: false
        schema:
          description: Return only records that occurred on or after this date and
            time. **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at >= from_datetime`
            **Default value:** `now() - 1 day` **Restriction:** `to_datetime - from_datetime`
            cannot exceed 45 days
          format: date-time
          title: From Datetime
          type: string
        style: form
      - description: Return only records that occurred before this date and time.
          **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at < to_datetime`
          **Default value:** `now()` **Restriction:** `to_datetime - from_datetime`
          cannot exceed 45 days
        explode: true
        in: query
        name: to_datetime
        required: false
        schema:
          description: Return only records that occurred before this date and time.
            **Format:** ISO 8601 (UTC) **Applies filter:** `occurred_at < to_datetime`
            **Default value:** `now()` **Restriction:** `to_datetime - from_datetime`
            cannot exceed 45 days
          format: date-time
          title: To Datetime
          type: string
        style: form
      - description: Include the raw data from the telematics provider. *Useful for
          auditing or accessing fields not normalized by Catena*
        explode: true
        in: query
        name: include_source_data
        required: false
        schema:
          default: false
          description: Include the raw data from the telematics provider. *Useful
            for auditing or accessing fields not normalized by Catena*
          title: Include Source Data
          type: boolean
        style: form
      - description: "Limit results to specific drivers. **Maximum:** 100 IDs To specify\
          \ multiple values, repeat the parameter for each value (e.g., `?driver_ids=id1&driver_ids=id2`)."
        explode: true
        in: query
        name: driver_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          maxItems: 100
          nullable: true
          type: array
        style: form
      - description: "Limit results to specific vehicles. **Maximum:** 100 IDs To\
          \ specify multiple values, repeat the parameter for each value (e.g., `?vehicle_ids=id1&vehicle_ids=id2`)."
        explode: true
        in: query
        name: vehicle_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          maxItems: 100
          nullable: true
          type: array
        style: form
      - description: "The name of the field to sort results by. If not provided, results\
          \ will be ordered by `occurred_at`. "
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "The order of sorting, either `asc` for ascending or `desc` for\
          \ descending. Defaults to `asc` if `sort_by` is provided without `sort_order`."
        explode: true
        in: query
        name: sort_order
        required: false
        schema:
          default: asc
          description: "The order of sorting, either `asc` for ascending or `desc`\
            \ for descending. Defaults to `asc` if `sort_by` is provided without `sort_order`."
          enum:
          - asc
          - desc
          title: Sort Order
          type: string
        style: form
      - description: Cursor for the next page
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Page size
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 300
          description: Page size
          maximum: 1000
          minimum: 1
          title: Size
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_CursorPage_DriverSafetyEventRead_'
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
          description: Method Not Allowed
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntity'
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedResponse'
          description: Not Implemented
      security:
      - Bearer:
        - telematics:read
      summary: List Driver Safety Events
      tags:
      - Safety & Driver Behavior
      x-mint:
        metadata:
          title: 🧪 List Driver Safety Events
        content: "<Callout icon=\"vial\" color=\"#FFC107\" iconType=\"solid\"><strong>Provisional\
          \ endpoint</strong><br/>This endpoint is available for early access. The\
          \ core schema is stable, but minor details — such as field names or added\
          \ fields — may change before it becomes generally available. Backward compatibility\
          \ is not guaranteed.<br/><br/><em>See <a href=\"/api-reference/stability-versioning\"\
          >API Stability &amp; Versioning</a> for details on provisional endpoints.</em></Callout>"
  /v2/telematics/users/{user_id}:
