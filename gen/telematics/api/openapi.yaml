          <Callout icon="vial" color="#FFC107" iconType="solid"><strong>Provisional endpoint</strong><br/>This endpoint is available for early access. The core schema is stable, but minor details — such as field names or added fields — may change before it becomes generally available. Backward compatibility is not guaranteed.<br/><br/><em>See <a href="/api-reference/stability-versioning">API Stability &amp; Versioning</a> for details on provisional endpoints.</em></Callout>
