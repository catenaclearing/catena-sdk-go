components:
  schemas:
    BadRequest:
      example:
        code: 0
        detail: detail
        message: Bad Request
      properties:
        code:
          default: 400
          title: Code
          type: integer
        message:
          default: Bad Request
          title: Message
          type: string
        detail:
          nullable: true
          type: string
      title: BadRequest
    BaseConnectionEvent:
      description: Base connection event.
      example:
        tsp_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        fleet_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        source_name: ada
        status: active
      properties:
        id:
          description: The ID of the connection
          format: uuid
          title: Connection ID
          type: string
        source_name:
          $ref: '#/components/schemas/TspEnum'
        fleet_id:
          description: The ID of the fleet
          format: uuid
          title: Fleet ID
          type: string
        tsp_id:
          description: The ID of the Telematics Service Provider (TSP) at Catena
          format: uuid
          title: TSP ID
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - fleet_id
      - id
      - source_name
      - status
      - tsp_id
      title: BaseConnectionEvent
    BaseEngineLog:
      description: Base class for Engine logs.
      example:
        driver_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        created_at: 2000-01-23T04:56:07.000+00:00
        extras:
          key: ""
        execution_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        co_driver_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        mil_status: true
        updated_at: 2000-01-23T04:56:07.000+00:00
        canonical_code: BRAKE_SWITCH_CIRCUIT
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        fleet_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        fault_code_description: fault_code_description
        tsp_slug: tsp_slug
        vehicle_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        source_name: ada
        fleet_ref: fleet_ref
        fault_code_source: J1708
        engine_status: true
        source_co_driver_id: source_co_driver_id
        deleted_at: 2000-01-23T04:56:07.000+00:00
        occurred_at: 2000-01-23T04:56:07.000+00:00
        source_driver_id: source_driver_id
        tsp_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        connection_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        source_id: source_id
        schedule_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        fault_code:
          key: ""
        source_vehicle_id: source_vehicle_id
        status: active
      properties:
