      description: |-
        API model for creating a fleet

        Used by Catena admins to create fleets directly.
        Most fleets are created automatically when accepting invitations.
      example:
        regulatory_id_date: 2000-01-23
        registered_fax: registered_fax
        address: address
        regulatory_id_type: regulatory_id_type
        city: city
        description: description
        dba_name: dba_name
        display_name: display_name
        registered_phone: registered_phone
        country_code: country_code
        regulatory_id: regulatory_id
        province: province
        name: name
        websites:
        - https://openapi-generator.tech
        - https://openapi-generator.tech
        registered_email: registered_email
        legal_name: legal_name
        regulatory_id_status: regulatory_id_status
        postal_code: postal_code
        properties:
        - value: value
          key: dot_number
        - value: value
          key: dot_number
      properties:
        name:
          title: Name
          type: string
        description:
          nullable: true
          type: string
        display_name:
          nullable: true
          type: string
        legal_name:
          nullable: true
          type: string
        dba_name:
          nullable: true
          type: string
        websites:
          items:
            format: uri
            maxLength: 2083
            minLength: 1
            type: string
          nullable: true
          type: array
        regulatory_id:
          nullable: true
          type: string
        regulatory_id_type:
          nullable: true
          type: string
        regulatory_id_date:
          format: date
          nullable: true
          type: string
        regulatory_id_status:
          nullable: true
          type: string
        registered_email:
          format: email
          nullable: true
          type: string
        registered_phone:
          format: phone
          nullable: true
          type: string
        registered_fax:
          format: phone
          nullable: true
          type: string
        address:
          nullable: true
          type: string
        city:
          nullable: true
          type: string
        province:
          nullable: true
          type: string
        postal_code:
          nullable: true
          type: string
        country_code:
          nullable: true
          pattern: "^\\w{3}$"
