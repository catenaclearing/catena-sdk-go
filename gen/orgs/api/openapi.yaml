openapi: 3.1.0
info:
  description: Organizations Service REST API
  title: Telematics Organizations Service - REST API
  version: 0.1.0
servers:
- description: Catena Telematics API
  url: https://api.catenatelematics.com
tags:
- description: "Send invitations to onboard fleets. Create magic links, track invitation\
    \ status, and manage the fleet onboarding workflow."
  name: Invitations
- description: "Manage data sharing agreements with fleets. Monitor agreement status,\
    \ update terms, and control access to fleet telematics data."
  name: Share Agreements
- description: View and manage fleet profiles. Access fleet information for fleets
    you've successfully onboarded through invitations.
  name: Fleets
- description: "Manage your partner organization profile. Update company information,\
    \ websites, and service categories visible to fleets."
  name: Partners
- description: Browse available Telematics Service Providers (TSPs). View supported
    integrations that fleets can connect to share their telematics data.
  name: TSPs
paths:
  /v2/orgs/fleets:
    get:
      description: Get a paginated list of Fleets accessible to your organization.
      operationId: list_fleets
      parameters:
      - description: Limit results to specific fleets using your organization's fleet
          reference identifiers
        explode: true
        in: query
        name: fleet_refs
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          nullable: true
          type: array
        style: form
      - description: Cursor for the next page
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Page size
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 500
          description: Page size
          maximum: 1000
          minimum: 1
          title: Size
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_CursorPageCustomized_FleetRead_'
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
          description: Method Not Allowed
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntity'
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
      security:
      - Bearer:
        - fleet:read
      summary: List Fleets
      tags:
      - Fleets
      x-mint:
        content: <Info>Partners can only list fleets they have active share agreements
          with</Info>
    post:
      description: Create a new fleet.
      operationId: create_fleet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetCreate'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetRead'
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
          description: Method Not Allowed
        "409":
          content:
            application/json:
