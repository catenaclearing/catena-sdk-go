                $ref: '#/components/schemas/TooManyRequests'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal Server Error
      security:
      - Bearer:
        - fleet:create
      summary: Create Fleet
      tags:
      - Fleets
      x-excluded: "true"
