name: Regenerate SDK

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC

jobs:
  regenerate:
    name: Regenerate SDK from latest specs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      
      - name: Set up Node.js (for Redocly CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli
      
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      
      - name: Fetch latest specs
        run: make specs.fetch
      
      - name: Combine specs
        run: make specs.combine
      
      - name: Generate client code
        run: make generate
      
      - name: Run CI checks
        run: make ci
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate SDK from latest OpenAPI specs'
          title: 'chore: regenerate SDK from latest OpenAPI specs'
          body: |
            This PR was automatically generated by the regenerate workflow.
            
            The OpenAPI specifications were re-fetched and the SDK client code was regenerated.
            
            **Changes:**
            - Fetched latest specs from API endpoints
            - Regenerated Go client code
            - Updated dependencies if needed
            
            Please review the changes to ensure they are expected.
          branch: auto/regenerate-sdk
          delete-branch: true
      
      - name: No changes detected
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No changes detected. SDK is up-to-date."
